# Domyslna konfiguracja: baza PostgreSQL z docker-compose.yml
spring:
  application:
    name: czas-pracy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/czas_pracy}
    username: ${DB_USER:czas_pracy}
    password: ${DB_PASSWORD:czas_pracy}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

---
# Profil "dev": baza H2 w pamieci, uruchomienie bez Dockera.
# Uzycie: mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:czas_pracy;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
